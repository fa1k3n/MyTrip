<!DOCTYPE html>
<!-- UI-13: Om Basläger, an animated film of how the app hangs together. Fictional family; loads nothing from other sites (SP-07). -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Om Basläger</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1D1B" media="(prefers-color-scheme: dark)">
<style>
/* Layout: one 16:9 stage like a film frame, the caption under it as subtitles, chapters as the app's tabs, the full script below. */
:root{
  --bg:#F5F2EB; --card:#fff; --ink:#2C2A29; --mute:#6B6560; --acc:#C87A53; --acct:#9A4F2B; --sage:#7A9A82; --sageT:#3F6249; --line:#E4DED2; --sky:#EFE7D9;
  --display:Fraunces,Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1D1B;--card:#2A2826;--ink:#F3EFE8;--mute:#B5ADA3;--acct:#E0A27F;--sageT:#A5C4AC;--line:#3E3A36;--sky:#26231F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F1D1B;--card:#2A2826;--ink:#F3EFE8;--mute:#B5ADA3;--acct:#E0A27F;--sageT:#A5C4AC;--line:#3E3A36;--sky:#26231F;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
[hidden]{display:none!important}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--acct);font-weight:600;text-decoration:none}
.back:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:8px}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.kick{color:var(--mute);font-size:.95rem;margin:0}
.stage{position:relative;background:var(--sky);border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%;box-shadow:0 2px 14px rgba(44,42,41,.08)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.scene[hidden]{display:none}
.sub{min-height:5.2em;margin:0;font-family:var(--display);font-weight:500;font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.45;max-width:62ch}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 .95rem var(--body);cursor:pointer;padding:0 14px;gap:6px}
.btn:focus-visible,.chap:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn svg{width:18px;height:18px}
.chaps{display:flex;gap:6px;flex-wrap:wrap}
.chap{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 .9rem var(--body);cursor:pointer;position:relative;overflow:hidden}
.chap[aria-current="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.chap .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
.chap[aria-current="true"] .fill{background:#fff}
.script{display:grid;gap:12px;margin:8px 0 0;padding:0;list-style:none;counter-reset:s}
.script li{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;align-items:start;counter-increment:s}
.script li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--acct);font-size:1.2rem;line-height:1.4}
.script h3{font-size:1.05rem}
.script p{margin:2px 0 0;color:var(--mute);max-width:65ch}
.roles{display:flex;gap:14px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.roles li{display:flex;align-items:center;gap:8px;font-size:.95rem}
.mark{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;border:1.5px solid var(--acc);color:var(--acct);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.mark.s{border-color:var(--sage);color:var(--sageT);background:color-mix(in srgb,var(--sage) 18%,var(--card))}
.mark.f{border-color:var(--line);color:var(--mute);background:var(--card)}
.mark svg{width:16px;height:16px}
section h2{font-size:1.3rem;margin-bottom:6px}

/* the drawing */
.ink{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.skin{fill:#EAD9C3}.eye{fill:#2C2A29}.smile{fill:none;stroke:#2C2A29;stroke-width:1.8;stroke-linecap:round}
.leg{fill:var(--ink)}.arm{stroke-width:9;stroke-linecap:round;fill:none}
.ground{stroke:var(--line);stroke-width:4}
.lbl{font:600 15px var(--body);fill:var(--mute);text-anchor:middle}
.big{font:700 64px var(--display);fill:var(--ink)}
.mid{font:700 26px var(--display);fill:var(--ink)}
.t{font:600 15px var(--body);fill:var(--ink)}
.tm{font:600 13px var(--body);fill:var(--mute)}
.card{fill:var(--card);filter:url(#soft)}
.acc{fill:var(--acc)}.accS{stroke:var(--acc)}.sage{fill:var(--sage)}.sageS{stroke:var(--sage)}
.badge circle{stroke-width:2.5}
.badge.o circle,.badge.p circle{fill:var(--card);stroke:var(--acc)}.badge.o path,.badge.p path,.badge.p circle.in{stroke:var(--acct)}
.badge.r circle{fill:var(--card);stroke:var(--sage)}.badge.r path,.badge.r circle.in{stroke:var(--sageT)}
.badge.f circle{fill:var(--card);stroke:var(--mute)}.badge.f path{stroke:var(--mute)}
.badge path,.badge circle.in{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.heart{fill:var(--acc)}
.dash{stroke:var(--mute);stroke-width:2.5;stroke-dasharray:6 7;fill:none}

/* motion: every element rests in its final place; the animation only plays it in */
@keyframes pop{from{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}to{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-260px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fly{from{transform:translate(-330px,-120px) rotate(-20deg);opacity:0}20%{opacity:1}to{transform:none;opacity:1}}
@keyframes move{0%,25%{transform:translate(-300px,0)}75%,100%{transform:none}}
@keyframes ring{from{stroke-dashoffset:302}}
@keyframes now{from{transform:translateY(-70px)}}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
.on .pop{animation:pop .6s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
.on .drop{animation:drop .9s cubic-bezier(.22,1,.36,1) both}
.on .rise{animation:rise .7s ease-out both}
.on .wave{animation:wave 1.1s ease-in-out 3;transform-box:view-box}
.on .bob{animation:bob 2.4s ease-in-out infinite}
.on .fly{animation:fly 1.6s cubic-bezier(.22,1,.36,1) both}
.on .move{animation:move 3.4s ease-in-out both}
.on .ring{animation:ring 2.2s ease-out both}
.on .now{animation:now 6s linear both}
.on .coin{animation:coin 1.4s ease-out both}
.on .orbit{animation:orbit 8s linear infinite;transform-box:view-box;transform-origin:400px 230px}
@media (prefers-reduced-motion:reduce){.on *{animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Till Basläger</a>
  <header>
    <h1>Om Basläger</h1>
    <p class="kick">Från dröm till minne, tillsammans</p>
  </header>

  <div class="stage" id="stage" role="img" aria-label="Animerad film om hur Basläger fungerar"></div>
  <p class="sub" id="sub" aria-live="polite"></p>

  <div class="bar">
    <button class="btn" id="prev" type="button" aria-label="Föregående scen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="btn main" id="play" type="button"></button>
    <button class="btn" id="next" type="button" aria-label="Nästa scen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <div class="chaps" id="chaps" role="tablist" aria-label="Kapitel"></div>
  </div>

  <section>
    <h2>Rollerna</h2>
    <ul class="roles">
      <li><span class="mark" id="m-o"></span>Skapare: har skapat resan</li>
      <li><span class="mark" id="m-p"></span>Planerare: ändrar allt i resan</li>
      <li><span class="mark s" id="m-r"></span>Resenär: tycker till, bockar av, lägger in utlägg</li>
      <li><span class="mark f" id="m-f"></span>Följare: får en länk och tittar</li>
    </ul>
  </section>

  <section>
    <h2>Hela manuset</h2>
    <ol class="script" id="script"></ol>
  </section>
</div>

<script>
// Icons: Lucide (ISC) crown, compass, luggage, link, heart, thumbs, mail, sun.
const ICON = {
  crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
  compass: '<path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle class="in" cx="12" cy="12" r="10"/>',
  luggage: '<path d="M6 20a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2"/><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><path d="M10 20h4"/><circle class="in" cx="16" cy="20" r="2"/><circle class="in" cx="8" cy="20" r="2"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  up: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 3a3.13 3.13 0 0 1 3 3.88Z"/>',
  down: '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 21a3.13 3.13 0 0 1-3-3.88Z"/>',
};
const svgIcon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n].replace(' class="in"', "")}</svg>`;
document.getElementById("m-o").innerHTML = svgIcon("crown");
document.getElementById("m-p").innerHTML = svgIcon("compass");
document.getElementById("m-r").innerHTML = svgIcon("luggage");
document.getElementById("m-f").innerHTML = svgIcon("link");

/** A role badge: a round mark with the role's icon, as on the trip cards. */
const badge = (kind, x, y, delay = 0, r = 17) => {
  const icon = { o: "crown", p: "compass", r: "luggage", f: "link" }[kind];
  return `<g transform="translate(${x} ${y})"><g class="badge ${kind} pop" style="animation-delay:${delay}s"><circle r="${r}"/><g transform="translate(-10 -10) scale(.84)">${ICON[icon]}</g></g></g>`;
};
/** A stick figure standing at x on the ground y; o: scale, colour of the scarf, a waving arm, a name. */
/** A figure in soft shapes (style 1): a round body in the person's colour, a face, short legs; x on the ground y.
 * o: scale, colour token, a waving or reaching arm, a name. */
const fig = (x, y, o = {}) => {
  const s = o.s ?? 1, c = `var(${o.c ?? "--acc"})`;
  const arm = o.wave ? `<line class="arm wave" style="stroke:${c};transform-origin:0px -58px" x1="0" y1="-58" x2="20" y2="-84"/>`
    : o.reach ? `<line class="arm" style="stroke:${c}" x1="0" y1="-58" x2="28" y2="-62"/>` : "";
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <rect class="leg" x="-11" y="-28" width="9" height="28" rx="4.5"/><rect class="leg" x="2" y="-28" width="9" height="28" rx="4.5"/>${arm}
    <rect x="-17" y="-70" width="34" height="48" rx="17" style="fill:${c}"/>
    <circle class="skin" cy="-84" r="15"/><circle class="eye" cx="-5" cy="-86" r="1.9"/><circle class="eye" cx="5" cy="-86" r="1.9"/>
    <path class="smile" d="M-4.5 -79.5 q4.5 3.5 9 0"/>
  </g>${o.name ? `<text class="lbl" x="${x}" y="${y + 24}">${o.name}</text>` : ""}`;
};
const ground = '<line class="ground" x1="0" y1="392" x2="800" y2="392"/>';
const card = (x, y, w, h, extra = "") => `<rect class="card" x="${x}" y="${y}" width="${w}" height="${h}" rx="16" ${extra}/>`;
const tent = (x, y, k = 1) => `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 0 L60 -90 L120 0 Z" class="acc"/><path d="M60 -90 L44 0 L76 0 Z" style="fill:var(--acct)"/><line class="ink" x1="60" y1="-90" x2="60" y2="-104"/><path d="M60 -104 l18 6 l-18 6 z" class="sage"/></g>`;

const SCENES = [
  { chap: "Basläger", title: "En plats för hela resan",
    text: "Basläger är platsen där en resa, stor som liten, börjar som en dröm och slutar som ett minne. Alla som ska med är med hela vägen, inte bara den som bokar.",
    svg: () => `${ground}<circle cx="680" cy="90" r="38" style="fill:var(--acc);opacity:.35"/>
      <text class="big rise" x="400" y="120" text-anchor="middle">Basläger</text>
      <text class="lbl rise" style="animation-delay:.3s;font-size:18px" x="400" y="156">drömma · planera · uppleva · minnas</text>
      <g class="rise" style="animation-delay:.4s">${tent(340, 392)}</g>
      <g class="bob">${fig(220, 392, { name: "Anna", wave: true })}</g>
      ${fig(280, 392, { name: "Erik", c: "--sage" })}
      ${fig(520, 392, { name: "Olle", s: .72, c: "--acct" })}
      <g class="bob" style="animation-delay:.6s">${fig(575, 392, { name: "Mia", s: .66, c: "--sage", wave: true })}</g>` },
  { chap: "Stort som smått", title: "Dagsturen och den långa resan",
    text: "Basläger passar lika bra för en dagstur till sjön som för två veckor i Italien. Dagsturen blir en dag med några önskningar och en matsäck. Den långa resan får många dagar, bokningar och en budget. Det är samma app och samma steg.",
    svg: () => `${ground}
      <g class="rise">${card(40, 60, 300, 230)}<text class="mid" x="62" y="104">Dagstur till sjön</text><text class="tm" x="62" y="128">lör 7 juni · 1 dag</text>
        <circle cx="300" cy="96" r="18" class="acc" style="opacity:.75"/>
        <rect x="62" y="148" width="256" height="36" rx="10" class="sage" style="opacity:.35"/><text class="t" x="74" y="172">10.00  Cykla till badplatsen</text>
        <rect x="62" y="194" width="256" height="36" rx="10" class="sage" style="opacity:.35"/><text class="t" x="74" y="218">12.30  Matsäck på klippan</text>
        <text class="tm" x="62" y="266">Budget: 150 kr för glass</text></g>
      <g class="rise" style="animation-delay:.6s">${card(400, 40, 360, 270)}<text class="mid" x="422" y="84">Sommar i Italien</text><text class="tm" x="422" y="108">1–14 juli · 14 dagar</text>
        ${Array.from({ length: 14 }, (_, i) => `<rect class="pop" style="animation-delay:${1 + i * .08}s;fill:var(${i % 3 ? "--sage" : "--acc"});opacity:${i % 3 ? .4 : .7}" x="${422 + (i % 7) * 46}" y="${126 + Math.floor(i / 7) * 46}" width="38" height="38" rx="10"/>`).join("")}
        <text class="tm" x="422" y="246">3 bokningar · 2 färjor · budget 38 000 kr</text>
        <text class="tm" x="422" y="270" style="fill:var(--acct)">Samma steg: Önska, Nåla, Uppleva, Minnas</text></g>
      ${fig(120, 392, { name: "Mia", s: .66, c: "--sage", wave: true })}${fig(190, 392, { name: "Anna", reach: true })}
      ${fig(560, 392, { name: "Erik", c: "--sage" })}${fig(630, 392, { name: "Olle", s: .72, c: "--acct", wave: true })}` },
  { chap: "Drömmar", title: "Allt börjar på Drömmar",
    text: "Varje kort på startsidan Drömmar är en resa ni drömmer om. Anna trycker på Skapa ny resa och döper den till Höstlov i Berlin. Hon har skapat resan och får kronan: hon är Skapare.",
    svg: () => `${ground}${fig(140, 392, { name: "Anna", reach: true })}
      ${card(250, 50, 500, 320)}<text class="mid" x="276" y="94">Drömmar</text>
      ${card(276, 116, 140, 104, 'style="opacity:.55"')}<text class="t" x="290" y="150" style="opacity:.6">Sommar i Skåne</text>
      ${card(432, 116, 140, 104, 'style="opacity:.55"')}<text class="t" x="446" y="150" style="opacity:.6">Fjällvandring</text>
      <g class="pop" style="animation-delay:.8s">${card(588, 116, 140, 104, 'style="stroke:var(--acc);stroke-width:3"')}<text class="t" x="600" y="146">Höstlov i Berlin</text><text class="tm" x="600" y="166">24–28 okt</text></g>
      ${badge("o", 616, 196, 1.5, 15)}
      <rect x="276" y="240" width="452" height="104" rx="12" class="dash"/><text class="lbl" x="502" y="298" style="fill:var(--acct)">+ Skapa ny resa</text>` },
  { chap: "Bjud in", title: "Bjud in de andra",
    text: "Anna kopplar de andra till resan. Erik blir Planerare och får ändra allt. Olle och Mia är Resenärer: de tycker till, bockar av och lägger in egna utlägg. Mormor Kim får en följarlänk och kan titta på resan hemifrån.",
    svg: () => `${ground}
      ${fig(120, 392, { name: "Anna" })}${badge("o", 120, 264, .2)}
      ${fig(250, 392, { name: "Erik", c: "--sage" })}${badge("p", 250, 264, .8)}
      ${fig(370, 392, { name: "Olle", s: .72, c: "--acct" })}${badge("r", 370, 300, 1.4)}
      ${fig(460, 392, { name: "Mia", s: .66, c: "--sage" })}${badge("r", 460, 306, 1.8)}
      <path class="dash rise" style="animation-delay:2.2s" d="M500 250 C 560 190, 620 190, 680 250"/>
      ${fig(690, 392, { name: "Kim (Följare)", c: "--mute", wave: true })}${badge("f", 690, 264, 2.8)}
      <text class="mid rise" x="400" y="120" text-anchor="middle">Alla ser samma resa</text>
      <text class="lbl rise" style="animation-delay:.3s" x="400" y="150">men var och en med sin roll</text>` },
  { chap: "Önska", title: "Önska: alla fyller på",
    text: "I Önska lägger alla in det de drömmer om: ett museum, en badplats, världens bästa glass. Den som hittar något på nätet kan mejla in länken, så blir den en önskan. Hjärtana visar vad flest vill.",
    svg: () => `${ground}${fig(110, 392, { name: "Olle", s: .72, c: "--acct", wave: true })}${fig(700, 392, { name: "Erik", c: "--sage", reach: true })}
      ${[["Museiön", 210, .2, 4], ["Glass vid Spree", 345, .7, 7], ["Djurparken", 480, 1.2, 5]].map(([n, x, d, h]) => `
        <g class="drop" style="animation-delay:${d}s">${card(x, 120, 120, 140)}<rect x="${x + 10}" y="130" width="100" height="62" rx="8" style="fill:var(--sage);opacity:.35"/><text class="t" x="${x + 12}" y="218">${n}</text></g>
        <g class="pop" style="animation-delay:${d + 1.2}s"><path class="heart" transform="translate(${x + 12} 230) scale(.9)" d="M12 21s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.6-9.5 9-9.5 9z"/><text class="t" x="${x + 40}" y="248">${h}</text></g>`).join("")}
      <g class="fly" style="animation-delay:2.4s"><rect x="620" y="140" width="62" height="44" rx="6" class="card" style="stroke:var(--acc);stroke-width:3"/><path d="M620 146 l31 20 l31 -20" fill="none" style="stroke:var(--acc);stroke-width:3"/></g>
      <text class="tm rise" style="animation-delay:3.2s" x="651" y="210" text-anchor="middle">mejlad länk</text>` },
  { chap: "Nåla", title: "Nåla: önskningar blir en plan",
    text: "I Nåla blir önskningarna en plan. Erik drar en önskan till en dag, så hamnar den i schemat. Budgeten räknar med det som är bokat och betalt, och appen säger till om något krockar.",
    svg: () => `${ground}${fig(90, 392, { name: "Erik", c: "--sage", reach: true })}
      ${["Lör 24", "Sön 25", "Mån 26"].map((d, i) => `${card(170 + i * 150, 50, 136, 300)}<text class="t" x="${184 + i * 150}" y="80">${d}</text>
        <rect x="${182 + i * 150}" y="96" width="112" height="34" rx="8" style="fill:var(--sage);opacity:.3"/>${i < 2 ? `<rect x="${182 + i * 150}" y="140" width="112" height="34" rx="8" style="fill:var(--sage);opacity:.3"/>` : ""}`).join("")}
      <g class="move" style="animation-delay:.4s">${card(482, 140, 112, 50, 'style="stroke:var(--acc);stroke-width:3"')}<text class="t" x="494" y="171">Museiön</text></g>
      <g transform="translate(680 160)"><circle r="48" fill="none" style="stroke:var(--line)" stroke-width="16"/>
        <circle class="ring" r="48" fill="none" style="stroke:var(--acc)" stroke-width="16" stroke-dasharray="302" stroke-dashoffset="110" transform="rotate(-90)"/>
        <text class="t" y="6" text-anchor="middle">Budget</text></g>
      <text class="tm" x="680" y="240" text-anchor="middle">8 400 av 12 000 kr</text>` },
  { chap: "Uppleva", title: "Uppleva: dagen ni är på",
    text: "Under resan visar Uppleva dagen ni är på: vad som händer nu, vädret och vägen dit. Mia köper glass och lägger in utlägget direkt i telefonen, också utan nät. Det skickas när telefonen hittar nätet igen.",
    svg: () => `${ground}${fig(170, 392, { name: "Mia", s: .66, c: "--sage", reach: true })}
      <rect x="290" y="30" width="220" height="350" rx="28" style="fill:var(--ink)"/><rect x="302" y="44" width="196" height="322" rx="18" style="fill:var(--card)"/>
      <text class="t" x="318" y="76">Mån 26 okt</text><circle cx="470" cy="70" r="12" style="fill:var(--acc);opacity:.7"/><text class="tm" x="448" y="98">12 °C</text>
      ${[["10.00", "Museiön"], ["13.00", "Glass vid Spree"], ["15.30", "Hem till hotellet"]].map(([t, n], i) => `<text class="tm" x="318" y="${140 + i * 64}">${t}</text>
        <rect x="364" y="${122 + i * 64}" width="120" height="30" rx="8" style="fill:var(--sage);opacity:${i === 1 ? .6 : .3}"/><text class="t" x="372" y="${142 + i * 64}" style="font-size:13px">${n}</text>`).join("")}
      <g class="now"><line x1="312" y1="216" x2="488" y2="216" style="stroke:var(--acc)" stroke-width="3"/><text class="tm" x="316" y="210" style="fill:var(--acct)">Nu</text></g>
      ${[[-70, -90], [80, -110], [20, -140], [-30, -130], [110, -60]].map(([dx, dy], i) => `<circle class="coin" style="--dx:${dx}px;--dy:${dy}px;animation-delay:${2.2 + i * .12}s;fill:var(--acc)" cx="400" cy="330" r="9"/>`).join("")}
      <g class="pop" style="animation-delay:2s">${card(560, 250, 170, 60, 'style="stroke:var(--acc);stroke-width:3"')}<text class="t" x="576" y="278">+ 60 kr glass</text><text class="tm" x="576" y="298">betalt av Mia</text></g>` },
  { chap: "Minnas", title: "Minnas: vad blev bäst?",
    text: "Efteråt säger alla i Minnas vad de tyckte om önskningarna som blev av: tummen upp, tummen ner eller göra igen. Under Pengar syns vem som har betalat vad, och vem som ska föra över till vem.",

        <g transform="translate(${x + 44} 124)"><g class="pop" style="animation-delay:${d}s"><circle cx="20" cy="20" r="24" style="fill:${v === "up" ? "var(--sage)" : "var(--line)"}"/><g transform="translate(8 8)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:${v === "up" ? "#fff" : "var(--mute)"}">${ICON[v]}</g></g></g>`).join("")}
      <g class="rise" style="animation-delay:2s">${card(300, 230, 360, 120)}<text class="t" x="320" y="262">Saldo</text>

        <text class="tm" x="320" y="340" style="fill:var(--acct)">Erik för över 400 kr till Anna</text></g>` },

const DUR = 9000;
const stage = document.getElementById("stage"), sub = document.getElementById("sub"), chaps = document.getElementById("chaps");
stage.innerHTML = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2C2A29" flood-opacity=".12"/></filter></defs></svg>` + SCENES.map((s, i) => `<svg class="scene" viewBox="0 0 800 450" aria-hidden="true" ${i ? "hidden" : ""}>${s.svg()}</svg>`).join("");
const scenes = [...stage.querySelectorAll(".scene")];
chaps.innerHTML = SCENES.map((s, i) => `<button class="chap" type="button" role="tab" id="chap-${i}" aria-current="${!i}">${s.chap}<span class="fill"></span></button>`).join("");
document.getElementById("script").innerHTML = SCENES.map((s) => `<li><div><h3>${s.title}</h3><p>${s.text}</p></div></li>`).join("");
const fills = [...chaps.querySelectorAll(".fill")];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let at = 0, playing = !reduce, started = performance.now(), elapsed = 0;

function show(i) {
  at = (i + SCENES.length) % SCENES.length;
  scenes.forEach((s, n) => { s.toggleAttribute("hidden", n !== at); s.classList.remove("on"); }); // an SVG element has no hidden property
  void scenes[at].getBoundingClientRect(); // restart the scene's animations
  scenes[at].classList.add("on");
  sub.textContent = SCENES[at].text;
  stage.setAttribute("aria-label", `Scen ${at + 1} av ${SCENES.length}: ${SCENES[at].title}`);
  [...chaps.children].forEach((b, n) => b.setAttribute("aria-current", String(n === at)));
  fills.forEach((f, n) => { f.style.width = n < at ? "100%" : "0"; });
  elapsed = 0; started = performance.now();
}
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Spela', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Pausa';
const playBtn = document.getElementById("play");
const setPlaying = (p) => { playing = p; playBtn.innerHTML = p ? PAUSE : PLAY; if (p) started = performance.now() - elapsed; };
playBtn.addEventListener("click", () => { if (!playing && at === SCENES.length - 1 && elapsed >= DUR) show(0); setPlaying(!playing); });
document.getElementById("prev").addEventListener("click", () => show(at - 1));
document.getElementById("next").addEventListener("click", () => show(at + 1));
chaps.addEventListener("click", (e) => { const b = e.target.closest(".chap"); if (b) show([...chaps.children].indexOf(b)); });
function tick(now) {
  if (playing) {
    elapsed = now - started;
    fills[at].style.width = `${Math.min(100, elapsed / DUR * 100)}%`;
    if (elapsed >= DUR) { if (at < SCENES.length - 1) show(at + 1); else { elapsed = DUR; setPlaying(false); } }
  }
  requestAnimationFrame(tick);
}
show(0); setPlaying(playing); requestAnimationFrame(tick);
</script>
